# Локальная разработка / демо-стек. Не для продакшена.
# Переменные Postgres и JWT — в корневом .env (см. .env.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kono}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kono}
      POSTGRES_DB: ${POSTGRES_DB:-kono}
    ports:
      # 5433 на хосте — чтобы не конфликтовать с локальным Postgres на 5432
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - kono_db:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kono}:${POSTGRES_PASSWORD:-kono}@db:5432/${POSTGRES_DB:-kono}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      VERSION: 1.0.0
      LM_BASE_URL: ${LM_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_API_KEY: ${LM_API_KEY:-lm-studio}
      LM_MODEL: ${LM_MODEL:-gemma-4-e4b-it}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-http://host.docker.internal:10809}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:4173"

volumes:
  kono_db: